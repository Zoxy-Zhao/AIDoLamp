name: Four-joint lamp software tests
on: [push, pull_request]
jobs:
  motion-and-gripper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r software-requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q src tests
      - run: python -m src.motion4dof
      - uses: actions/upload-artifact@v4
        with:
          name: four-joint-lamp-demo
          path: output/
